name: repave gates
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install repave-engine
        run: pip install "repave-engine==2.34.0"
      - name: Install Checkov
        run: pip install "checkov==3.2.366"
      - name: Run golden path gates
        run: repave gates --path .
